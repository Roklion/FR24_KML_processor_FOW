<!DOCTYPE html>
<html>
<head>
  <title>KML Processor</title>
</head>
<body>
  <h1>KML Input Files</h1>
  <div id="dropZone" style="border: 2px dashed #ccc; padding:20px;">
    <p>Drag and drop KML files here for processing</p>
  </div>
  <ul id="knotsList"></ul>
  <script>
    const EARTH_RADIUS_METERS = 6371000;
    const SAMPLE_INTERVAL_METERS = 1000;
    const MAX_DISPLAYED_ISSUES = 10;
    const DEGREES_TO_RADIANS = Math.PI / 180;
    const RADIANS_TO_DEGREES = 180 / Math.PI;

    function toRadians(degrees) {
      return degrees * DEGREES_TO_RADIANS;
    }

    function toDegrees(radians) {
      return radians * RADIANS_TO_DEGREES;
    }

    function calculateHaversineDistance(coord1, coord2) {
      const [lon1, lat1] = coord1;
      const [lon2, lat2] = coord2;
      const dLat = toRadians(lat2 - lat1);
      const dLon = toRadians(lon2 - lon1);
      const a = Math.min(1,
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRadians(lat1)) * Math.cos(toRadians(lat2)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2)
      );
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      const distance = EARTH_RADIUS_METERS * c;
      return distance;
    }

    function getElementsByLocalName(node, localName) {
      return Array.from(node.getElementsByTagNameNS("*", localName));
    }

    function getDirectChildText(node, localName) {
      const child = Array.from(node.childNodes).find(
        element => element.nodeType === 1 && element.localName === localName
      );
      return child ? child.textContent.trim() : "";
    }

    function parseCoordinateText(coordinatesText) {
      const points = [];
      const invalidTokens = [];
      const tokens = coordinatesText.trim().split(/\s+/).filter(Boolean);

      tokens.forEach(token => {
        const fields = token.split(",");
        const longitude = Number(fields[0]);
        const latitude = Number(fields[1]);

        if (
          fields.length < 2 ||
          !Number.isFinite(longitude) ||
          !Number.isFinite(latitude) ||
          longitude < -180 ||
          longitude > 180 ||
          latitude < -90 ||
          latitude > 90
        ) {
          invalidTokens.push(token);
          return;
        }

        // Altitude, when present, is intentionally ignored. The output is a
        // 2D ground track unless altitude support is added later.
        points.push([longitude, latitude]);
      });

      return { points, invalidTokens };
    }

    // Return a point at fraction t along the great-circle route between two
    // longitude/latitude pairs. Unlike arithmetic lon/lat interpolation, this
    // correctly follows the Earth's curvature and crosses the IDL correctly.
    function interpolateGreatCircle(coord1, coord2, t) {
      const lon1 = toRadians(coord1[0]);
      const lat1 = toRadians(coord1[1]);
      const lon2 = toRadians(coord2[0]);
      const lat2 = toRadians(coord2[1]);

      const x1 = Math.cos(lat1) * Math.cos(lon1);
      const y1 = Math.cos(lat1) * Math.sin(lon1);
      const z1 = Math.sin(lat1);
      const x2 = Math.cos(lat2) * Math.cos(lon2);
      const y2 = Math.cos(lat2) * Math.sin(lon2);
      const z2 = Math.sin(lat2);

      const dotProduct = Math.max(-1, Math.min(1, x1 * x2 + y1 * y2 + z1 * z2));
      const angularDistance = Math.acos(dotProduct);

      // Identical points do not have a defined interpolation direction.
      if (angularDistance < 1e-12) {
        return coord2;
      }

      // There is no unique shortest great-circle route between antipodal
      // points. Treating the later point as invalid is safer for a flight
      // track than generating an arbitrary or unstable route.
      if (Math.PI - angularDistance < 1e-10) {
        return null;
      }

      const sinAngularDistance = Math.sin(angularDistance);
      const weight1 = Math.sin((1 - t) * angularDistance) / sinAngularDistance;
      const weight2 = Math.sin(t * angularDistance) / sinAngularDistance;

      const x = weight1 * x1 + weight2 * x2;
      const y = weight1 * y1 + weight2 * y2;
      const z = weight1 * z1 + weight2 * z2;

      const latitude = Math.atan2(z, Math.sqrt(x * x + y * y));
      const longitude = Math.atan2(y, x);

      return [toDegrees(longitude), toDegrees(latitude)];
    }

    function addPointToSegments(segments, point) {
      const currentSegment = segments[segments.length - 1];

      if (currentSegment.length === 0) {
        currentSegment.push(point);
        return;
      }

      const previousPoint = currentSegment[currentSegment.length - 1];
      const longitudeDifference = point[0] - previousPoint[0];

      if (Math.abs(longitudeDifference) <= 180) {
        currentSegment.push(point);
        return;
      }

      // A KML LineString still draws a long segment between +180 and -180.
      // End the current line at the antimeridian and start a new line on the
      // opposite representation of the same boundary point.
      const unwrappedLongitude = longitudeDifference > 0
        ? point[0] - 360
        : point[0] + 360;
      const boundaryLongitude = unwrappedLongitude > previousPoint[0] ? 180 : -180;
      const fraction =
        (boundaryLongitude - previousPoint[0]) /
        (unwrappedLongitude - previousPoint[0]);
      const crossingPoint = interpolateGreatCircle(
        previousPoint,
        point,
        Math.max(0, Math.min(1, fraction))
      );

      if (!crossingPoint) {
        return;
      }

      crossingPoint[0] = boundaryLongitude;
      currentSegment.push(crossingPoint);
      segments.push([
        [-boundaryLongitude, crossingPoint[1]],
        point
      ]);
    }

    function buildInterpolatedSegments(coordinates) {
      const segments = [[]];
      let previousCoordinates = coordinates[0];
      let removedAntipodalPoints = 0;

      addPointToSegments(segments, previousCoordinates);

      for (let index = 1; index < coordinates.length; index++) {
        const currentCoordinates = coordinates[index];
        const distanceMeters = calculateHaversineDistance(
          previousCoordinates,
          currentCoordinates
        );
        const numSegmentPoints = Math.ceil(
          distanceMeters / SAMPLE_INTERVAL_METERS
        );
        let skippedCurrentPoint = false;

        for (let i = 1; i <= numSegmentPoints; i++) {
          const fraction = i / numSegmentPoints;
          const interpolatedPoint = interpolateGreatCircle(
            previousCoordinates,
            currentCoordinates,
            fraction
          );

          if (!interpolatedPoint) {
            skippedCurrentPoint = true;
            break;
          }

          addPointToSegments(segments, interpolatedPoint);
        }

        if (skippedCurrentPoint) {
          removedAntipodalPoints++;
          continue;
        }

        previousCoordinates = currentCoordinates;
      }

      return { segments, removedAntipodalPoints };
    }
	
    // Function to handle dropped files
    async function handleFileDrop(event) {
      event.preventDefault();

      const files = event.dataTransfer.files;
      const dropZone = document.getElementById("dropZone");
      const knotsList = document.getElementById("knotsList");

      dropZone.innerHTML = "Processing...";
      knotsList.innerHTML = "";
      let fileNumber = 0;

      for (const file of files) {
        fileNumber++;
        try {
          const kmlText = await readFileAsText(file);
          const xmlDocument = new DOMParser().parseFromString(kmlText, "text/xml");

          const result = processKML(xmlDocument, file.name);

          let message = `${fileNumber}. Processed: ${file.name}`;
          if (result.removedInvalidPoints > 0) {
            message += ` (removed ${result.removedInvalidPoints} invalid point(s))`;
          }
          if (result.removedAntipodalPoints > 0) {
            message += ` (removed ${result.removedAntipodalPoints} unstable point(s))`;
          }
          addStatusMessage(message, "success");

          if (result.issues.length > 0) {
            addStatusMessage(`Warning: ${file.name} — ${result.issues[0]}`, "warning");
          }

          result.issues.forEach(issue => console.warn(`${file.name}: ${issue}`));
          await wait(200);
        } catch (error) {
          console.error(`Error while processing ${file.name}:`, error);
          addStatusMessage(
            `${fileNumber}. Error: ${file.name} — ${error.message}`,
            "error"
          );
        }
      }

      dropZone.innerHTML = "<p>Drag and drop multiple KML files here</p>";
      dropZone.style.background = "none";
    }

    function addStatusMessage(message, status) {
      const listItem = document.createElement("li");
      listItem.textContent = message;
      if (status === "error") {
        listItem.style.color = "#b00020";
      } else if (status === "warning") {
        listItem.style.color = "#8a5a00";
      }
      document.getElementById("knotsList").appendChild(listItem);
    }
  
    // Function to read a file as text using Promise
    function readFileAsText(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = event => resolve(event.target.result);
        reader.onerror = reject;
        reader.readAsText(file);
      });
    }

    function processKML(xmlDocument, filename) {
      const rootName = xmlDocument.documentElement
        ? xmlDocument.documentElement.localName
        : "";
      const parserErrors = getElementsByLocalName(xmlDocument, "parsererror");

      if (rootName === "parsererror" || parserErrors.length > 0) {
        throw new Error("The file is not valid XML/KML.");
      }

      const issues = [];
      let removedInvalidPoints = 0;
      let skippedPlacemarks = 0;
      const folders = getElementsByLocalName(xmlDocument, "Folder");

      // FlightRadar24 exports the sampled flight path in Trail and a
      // simplified route in Route. Remove every Route folder before reading
      // placemarks so Route does not get mixed into the observed track.
      folders
        .filter(folder => getDirectChildText(folder, "name") === "Route")
        .forEach(routeFolder => routeFolder.remove());

      const placemarks = getElementsByLocalName(xmlDocument, "Placemark");
      const trackCoordinates = [];

      placemarks.forEach((placemark, placemarkIndex) => {
        const coordinateElements = getElementsByLocalName(placemark, "coordinates");

        if (coordinateElements.length === 0) {
          skippedPlacemarks++;
          issues.push(`Placemark ${placemarkIndex + 1} has no coordinates.`);
          return;
        }

        let validPointsInPlacemark = 0;
        coordinateElements.forEach(coordinatesElement => {
          const parsed = parseCoordinateText(coordinatesElement.textContent);

          parsed.invalidTokens.forEach(invalidToken => {
            removedInvalidPoints++;
            if (issues.length < MAX_DISPLAYED_ISSUES) {
              issues.push(
                `Placemark ${placemarkIndex + 1} has an invalid coordinate ` +
                `(${invalidToken}). That point was removed.`
              );
            }
          });

          parsed.points.forEach(point => {
            const previousPoint = trackCoordinates[trackCoordinates.length - 1];
            const isDuplicate = previousPoint &&
              previousPoint[0] === point[0] &&
              previousPoint[1] === point[1];

            if (!isDuplicate) {
              trackCoordinates.push(point);
              validPointsInPlacemark++;
            }
          });
        });

        if (validPointsInPlacemark === 0) {
          skippedPlacemarks++;
          if (issues.length < MAX_DISPLAYED_ISSUES) {
            issues.push(`Placemark ${placemarkIndex + 1} has no valid coordinates.`);
          }
        }
      });

      if (trackCoordinates.length < 2) {
        throw new Error("The file does not contain at least two valid path points.");
      }

      const interpolated = buildInterpolatedSegments(trackCoordinates);
      const usableSegments = interpolated.segments.filter(
        segment => segment.length >= 2
      );

      if (usableSegments.length === 0) {
        throw new Error("No usable path could be built from the valid points.");
      }

      if (skippedPlacemarks > 0 && issues.length < MAX_DISPLAYED_ISSUES) {
        issues.push(`Skipped ${skippedPlacemarks} placemark(s) without valid points.`);
      }
      if (
        issues.length >= MAX_DISPLAYED_ISSUES &&
        (removedInvalidPoints > MAX_DISPLAYED_ISSUES || skippedPlacemarks > 0)
      ) {
        issues.push("Additional malformed-point warnings were omitted.");
      }

      const lineStrings = usableSegments.map(segment => `
            <LineString>
              <tessellate>1</tessellate>
              <altitudeMode>clampToGround</altitudeMode>
              <coordinates>${segment.map(point => point.join(",")).join(" ")}</coordinates>
            </LineString>`).join("");

      // Use separate LineStrings for the two sides of the IDL. A single KML
      // LineString would connect +180 directly to -180 across the globe.
      const updatedKML = `<?xml version="1.0" encoding="UTF-8"?>
        <kml xmlns="http://www.opengis.net/kml/2.2">
          <Document>
            <Placemark>
              <name>Simple Knot Line</name>
              <MultiGeometry>${lineStrings}
              </MultiGeometry>
            </Placemark>
          </Document>
        </kml>`;

      const modifiedFilename = `modified_${filename}`;
      downloadKML(updatedKML, modifiedFilename);

      return {
        issues,
        removedInvalidPoints,
        removedAntipodalPoints: interpolated.removedAntipodalPoints
      };
    }

    function downloadKML(updatedKMLText, filename) {
      // Create a Blob containing the KML data
      const blob = new Blob([updatedKMLText], { type: "text/xml" });
      const objectUrl = URL.createObjectURL(blob);

      // Create a link element to download the modified KML file
      const link = document.createElement("a");
      link.href = objectUrl;
      link.download = filename;

      // Programmatically click the link to trigger the download
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
    }

  // Function to introduce a delay using a Promise
  function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }
  const dropZone = document.getElementById("dropZone");
  dropZone.addEventListener("dragover", event => {
    event.preventDefault();
    dropZone.style.background = "#f0f0f0";
  });

  dropZone.addEventListener("dragleave", event => {
    event.preventDefault();
    dropZone.style.background = "none";
  });

  dropZone.addEventListener("drop", handleFileDrop);
  </script>
</body>
</html>
